# Builds the editor (apps/web) and deploys it to GitHub Pages. Manual only: Actions tab →
# "Deploy to GitHub Pages" → Run workflow. Before the first run, set the repository's
# Settings → Pages → Source to "GitHub Actions". The site is public to anyone with the link
# (on a private repository, Pages needs a paid plan). It is served at
# https://<owner>.github.io/<repository>/; the build uses relative paths, so no base path
# is needed.
name: Deploy to GitHub Pages
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer run waits instead of cancelling one in progress.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      # Never deploy an engine that fails its checks or the cross-engine tests.
      - run: npm run check
      - run: npm test
      - run: npm run build:web
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: apps/web/dist }

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
