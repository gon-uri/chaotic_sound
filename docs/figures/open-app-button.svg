<svg xmlns="http://www.w3.org/2000/svg" width="440" height="88" viewBox="0 0 440 88" role="img" aria-label="Open chaotic_sound in your browser">
  <title>Open chaotic_sound in your browser</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff8a2a"/>
      <stop offset="1" stop-color="#e2501a"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect x="6" y="4" width="428" height="76" rx="38" fill="url(#bg)" filter="url(#shadow)"/>
  <!-- a small strange-attractor-like loop as the icon -->
  <g transform="translate(58 42)" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" opacity="0.95">
    <path d="M -18 0 C -18 -14, -2 -14, -2 0 C -2 12, 18 14, 18 0 C 18 -12, 2 -12, 2 0 C 2 14, -18 14, -18 0 Z"/>
  </g>
  <polygon points="88,30 88,54 108,42" fill="#fff"/>
  <text x="122" y="40" fill="#fff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="25" font-weight="700">Open the app</text>
  <text x="122" y="62" fill="#fff" fill-opacity="0.9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14">play chaos in your browser — no install</text>
</svg>
